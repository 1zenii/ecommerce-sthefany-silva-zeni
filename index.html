<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Loja</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>

<body>
    <header>
        <button id="btn-menu">Menu</button>
        <nav id="menu" class="menu">
            <a href="#vitrine">Produtos</a>
            <a href="#contato">Contato</a>
        </nav>
    </header>

    <section class="banner">
        <h2>Minha Loja</h2>
        <p id="aviso-frete"></p>
    </section>

    <section id="vitrine" class="container">
        <div class="produtos">
            <div class="cartao">
                <img src="img/produto-1.jpg" alt="Produto 1">
                <p>Produto 1</p>
                <p>R$ 99,99</p>
            </div>
            <div class="cartao">
                <img src="img/produto-2.jpg" alt="Produto 2">
                <p>Produto 2</p>
                <p>R$ 149,99</p>
            </div>
            <div class="cartao">
                <img src="img/produto-3.jpg" alt="Produto 3">
                <p>Produto 3</p>
                <p>R$ 39,99</p>
            </div>
            <div class="cartao">
                <img src="img/produto-4.jpg" alt="Produto 4">
                <p>Produto 4</p>
                <p>R$ 199,99</p>
            </div>
            <div class="cartao">
                <img src="img/produto-5.jpg" alt="Produto 5">
                <p>Produto 5</p>
                <p>R$ 59,99</p>
            </div>
            <div class="cartao">
                <img src="img/produto-6.jpg" alt="Produto 6">
                <p>Produto 6</p>
                <p>R$ 30,00</p>
            </div>
        </div>
    </section>

    <section id="contato" class="container">
        <form id="contato-form">
            <input id="nomecompleto" type="text" placeholder="Seu nome completo">
            <input id="email" type="text" placeholder="Seu e-mail">
            <input id="telefone" type="text" placeholder="Seu telefone">
            <button type="submit">Enviar</button>

            <p id="erro"></p>
        </form>
    </section>

    <footer>
        <p>contato@minhaloja.com</p>
    </footer>
</body>

</html>
